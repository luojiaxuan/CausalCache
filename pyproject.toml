[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "causalcache"
version = "0.1.0"
description = "Budget-conditioned behavioral restoration for GUI memory"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
pilot = ["pyarrow>=15"]

[tool.setuptools.packages.find]
where = ["code"]
include = ["causalcache*", "scripts*"]
