[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "causalcache"
version = "0.1.0"
description = "Budget-conditioned behavioral restoration for GUI memory"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
pilot = ["pyarrow>=15"]
ocr = [
  "numpy==2.3.5",
  "onnxruntime==1.24.4",
  "opencv-python==4.10.0.84",
  "Pillow==12.2.0",
  "pyarrow==24.0.0",
  "rapidocr==3.8.4",
]

[tool.setuptools.packages.find]
where = ["code"]
include = ["causalcache*", "scripts*"]
