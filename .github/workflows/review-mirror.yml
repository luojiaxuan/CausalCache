# note (luojiaxuan): 每次 push 到 main,把脱敏镜像推到公开仓库 CausalCache-review。
# 需要仓库 Secret REVIEW_MIRROR_TOKEN:fine-grained PAT,仅对 luojiaxuan/CausalCache-review 有 Contents: Read and write。
name: review-mirror
on:
  push:
    branches: [main]
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: export sanitized mirror
        run: python3 tools/review_mirror.py --src . --out /tmp/mirror
      - name: push to public mirror
        env:
          TOKEN: ${{ secrets.REVIEW_MIRROR_TOKEN }}
        run: |
          set -e
          cd /tmp/mirror
          git init -q -b main
          git config user.name "review-mirror bot"
          git config user.email "review-mirror@users.noreply.github.com"
          echo "# CausalCache review mirror" > MIRROR.md
          echo "Sanitized export of the private repo for external review. Source commit: ${GITHUB_SHA}. Host/container/project identifiers are placeholders by design." >> MIRROR.md
          git add -A
          git commit -q -m "mirror of ${GITHUB_SHA}"
          git push --force "https://x-access-token:${TOKEN}@github.com/luojiaxuan/CausalCache-review.git" HEAD:main
