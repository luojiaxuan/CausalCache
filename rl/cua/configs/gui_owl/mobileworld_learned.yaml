# GUI-Owl RL(joint selector+executor)on MobileWorld —— learned 选帧主臂。
# v2 recipe:G=8 全 selector 臂 + RLOO(selector 侧车)/ grpo(executor,slime)。
# selector 服务地址由 CC_SELECTOR_URL 注入(adapter 回退读 env)。
agent_id: "gui_owl"
agent_kwargs:
  history_n: 3           # B=2,官方 CC_HISTORY_N=3 口径
  frame_policy: "learned"
  # Ray worker 不继承 driver shell 环境变量 —— selector 地址必须走 config。
  # 172.17.0.1 = docker 默认网桥宿主 IP(selector service 绑 127.0.0.1 时
  # 容器够不着;service 需绑 0.0.0.0 或发射前把此值换成宿主实 IP)。
  selector_url: "http://172.17.0.1:41010"
env_id: "mobileworld"
env_kwargs:
  max_steps: 50          # 官方口径(mw eval --max_round 50;对表/P0.5/B11 全在 50)。
                         # 30 是 smoke 省钱口径,实测饿死信号(3/4 批全灭),已弃
  extra_tools: ["terminate", "response"]   # 默认 [] 会把 terminate noop 掉(fid4 教训)
